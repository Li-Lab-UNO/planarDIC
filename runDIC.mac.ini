# runDIC.sh settings for macOS.
#
# runDIC.sh reads this file on macOS (Linux / Ubuntu uses runDIC.ubuntu.ini). Both files are
# tracked by git: edit either one on either computer and commit it like code. Command-line options
# override these values for one run, e.g.
#     ./runDIC.sh                        run with these settings
#     ./runDIC.sh --jobs 8 N1757/test2   override jobs and tests for one run
#     ./runDIC.sh --config other.ini     read another settings file instead
#
# Format (INI style): key = value. Text after # is a comment, as is a line starting with ";".
# An empty value keeps the built-in default; [section] lines are ignored.
# Lists are separated by spaces or commas.

# Tests to run when none are given on the command line: SAMPLE/testN or a whole sample (all its tests).
#   tests = N1739/test1 N1739/test2
#   tests = N1757 N1830
tests = N1757/test2

# Steps, in pipeline order: info sort config branches thickness scale widths track artifacts report jfig exports edge compare fit
# Empty = all.
steps =

# Parallel tracking / export jobs. auto = CPU count - 1 (9 on the 10-core M4); one test has 9 deformations.
jobs = auto

# Deformations to track (a list, or a range like Def11-Def19) and to export.
defs = Def11-Def19
export_defs = Def11

# Seconds between tracking status lines (0 = off).
status = 1

# yes = track each deformation to the end of loading only (about 55% of the frames); no = full cycle.
loading_only = yes

# yes = start without asking "Proceed?".
yes = no

# yes = windows, one test at a time: the label and notes, the sorting table (proceed or stop the test), the
# tine tips (click the rakes that are wrong), the loading branches (click the wrong ones) and the thickness
# measurement; the tracking report after tracking, before the figures and fits (with a deformation marked
# Check or Problem: proceed or stop that test). no = run without them (info and thickness skipped).
review = yes

# Label written into a new test_config.json (config step), e.g., healthy.
label =

# Python to use (relative to this folder or absolute).
python = .venv/bin/python
