# runDIC.sh settings for Linux / Ubuntu.
#
# runDIC.sh reads this file on Linux / Ubuntu (macOS uses runDIC.mac.ini). Both files are
# tracked by git: edit either one on either computer and commit it like code. Command-line options
# override these values for one run, e.g.
#     ./runDIC.sh                        run with these settings
#     ./runDIC.sh --jobs 8 N1757/test2   override jobs and tests for one run
#     ./runDIC.sh --config other.ini     read another settings file instead
#
# Format (INI style): key = value. Text after # is a comment, as is a line starting with ";".
# An empty value keeps the built-in default; [section] lines are ignored.
# Lists are separated by spaces or commas.

# Tests to run when none are given on the command line: SAMPLE/testN or a whole sample (all its tests).
#   tests = N1739/test1 N1739/test2
#   tests = N1757 N1830
tests =

# Steps, in pipeline order: sort config scale widths thickness track artifacts jfig exports edge compare
# Empty = all.
steps =

# Parallel tracking / export jobs. auto = CPU count - 1. The Threadripper 7970X has 32 cores (64 threads);
# one job per core leaves 2 threads per job. One test has 9 deformations, so more jobs only help
# when several tests are run together.
jobs = 32

# Deformations to track (a list, or a range like Def11-Def19) and to export.
defs = Def11-Def19
export_defs = Def11

# Seconds between tracking status lines (0 = off).
status = 1

# yes = track each deformation to the end of loading only (about 55% of the frames); no = full cycle.
loading_only = no

# yes = start without asking "Proceed?".
yes = no

# Thickness for the fits (thickness step): auto = measured from the photos for every test, in place of the
# workbook (a test whose photos give none keeps the workbook value); workbook = the sample's thickness
# workbook, measured from the photos only for tests without one.
thickness = auto

# Label written into a new test_config.json (config step), e.g. labeled healthy.
label =

# Python to use (relative to this folder or absolute).
python = .venv/bin/python
